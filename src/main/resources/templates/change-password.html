<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<th:block layout:fragment="content">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
          <div class="card-header">
            <h3 class="text-center fw-bold my-4">비밀번호 변경 (CSRF 데모)</h3>
          </div>
          <div class="card-body">
            <!-- th:action 폼은 CSRF 가 켜지면 hidden _csrf 토큰이 자동으로 삽입된다 -->
            <form th:action="@{/users/change-password}" method="post">
              <div class="form-floating mb-3">
                <input class="form-control" type="password" id="newPassword" name="newPassword" required="required" autofocus="autofocus" />
                <label for="newPassword">새 비밀번호</label>
              </div>
              <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                <button type="submit" class="btn btn-primary">변경</button>
              </div>
            </form>
            <p class="mt-3 text-success" th:if="${msg}" th:text="${msg}"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</th:block>
</html>

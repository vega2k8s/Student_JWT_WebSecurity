spring.application.name=MySpringBootApp
# port \uBC88\uD638 \uBCC0\uACBD
server.port=8080

# \uC0AC\uC6A9\uC790\uAC00 \uC815\uC758\uD55C \uD658\uACBD\uBCC0\uC218
myboot.age=${random.int(1,100)}
myboot.fullName=${myboot.name} Boot

# \uD604\uC7AC \uD65C\uC131\uD654\uB41C \uD658\uACBD\uC744 \uB098\uD0C0\uB0B4\uB294 \uBB38\uC790\uC5F4\uC124\uC815
spring.profiles.active=prod

# log file
logging.file.path=logs

# [\uBCF4\uC548 \uAC10\uC0AC \uB85C\uAE45] (OWASP #9) - \uC778\uC99D \uC774\uBCA4\uD2B8/\uC811\uADFC \uAC70\uBD80 \uAC10\uC0AC \uB85C\uADF8\uAC00 \uD56D\uC0C1 \uCD9C\uB825\uB418\uB3C4\uB85D \uB808\uBCA8 \uC9C0\uC815
# \uC8FC\uC758: \uBE44\uBC00\uBC88\uD638\u00B7JWT \uB4F1 \uBBFC\uAC10\uC815\uBCF4\uB294 \uB85C\uADF8\uC5D0 \uB0A8\uAE30\uC9C0 \uC54A\uB294\uB2E4(\uCF54\uB4DC\uC5D0\uC11C \uB9C8\uC2A4\uD0B9 \uCC98\uB9AC)
logging.level.com.basic.myspringboot.security.logging=INFO
logging.level.com.basic.myspringboot.exception.advice=INFO

# [\uC608\uC678 \uCC98\uB9AC \uD558\uB4DC\uB2DD] (OWASP #10) - Spring Boot \uAE30\uBCF8 \uC624\uB958 \uCC98\uB9AC\uAE30(@ControllerAdvice \uBBF8\uD3EC\uCC29 \uC624\uB958)\uC758 \uB178\uCD9C \uCC28\uB2E8
# \uCD5C\uC2E0 Spring Boot \uAE30\uBCF8\uAC12\uC774 \uC774\uBBF8 never \uC774\uC9C0\uB9CC, \uC758\uB3C4\uB97C \uBA85\uC2DC\uD55C\uB2E4.
# (@RestControllerAdvice \uB85C \uCC98\uB9AC\uB418\uB294 \uC608\uC678\uB294 \uCF54\uB4DC\uC5D0\uC11C \uC77C\uBC18 \uBA54\uC2DC\uC9C0+traceId \uB85C \uBCC4\uB3C4 \uD558\uB4DC\uB2DD)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# CORS \uD5C8\uC6A9 Origin ( \uC27C\uD45C\uB85C \uAD6C\uBD84, \uD504\uB860\uD2B8\uC5D4\uB4DC \uAC1C\uBC1C\uC11C\uBC84 \uC8FC\uC18C )
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500

# JWT \uC124\uC815
# \uC2E4\uC2B5\uC6A9 \uAE30\uBCF8\uAC12\uC774\uBA70, \uC6B4\uC601\uC5D0\uC11C\uB294 \uD658\uACBD\uBCC0\uC218 JWT_SECRET \uC73C\uB85C \uC8FC\uC785\uD55C\uB2E4 ( HS256 \uC740 32\uBC14\uC774\uD2B8 \uC774\uC0C1 \uD544\uC694 )
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
# \uC561\uC138\uC2A4 \uD1A0\uD070 \uB9CC\uB8CC \uC2DC\uAC04 ( \uCD08 ) - 900\uCD08 = 15\uBD84
# [2\uB2E8\uACC4] Refresh \uD1A0\uD070(\uC11C\uBC84 \uC800\uC7A5+\uD68C\uC804)\uC774 \uC0DD\uACA8 access \uB97C \uC9E7\uAC8C \uB458 \uC218 \uC788\uB2E4.
#   \uC9E7\uC740 access + \uD68C\uC804\uB418\uB294 refresh = \uD0C8\uCDE8 \uC2DC \uD53C\uD574 \uC2DC\uAC04 \uCD5C\uC18C\uD654 (1\uB2E8\uACC4\uB294 refresh \uAC00 \uC5C6\uC5B4 3600\uCD08 \uC720\uC9C0)
jwt.access-expire-seconds=900
# [2\uB2E8\uACC4] Refresh \uD1A0\uD070 \uB9CC\uB8CC \uC2DC\uAC04 ( \uCD08 ) - 1209600\uCD08 = 14\uC77C
jwt.refresh-expire-seconds=${JWT_REFRESH_EXPIRE_SECONDS:1209600}
# [JWT \uBCF4\uC548 \uC2E4\uC2B5] \uC57D\uD55C/\uAE30\uBCF8 secret \uC0AC\uC6A9 \uD5C8\uC6A9 \uC5EC\uBD80.
#   true  : (\uC2E4\uC2B5\u00B7\uCDE8\uC57D \uB370\uBAA8\uC6A9) \uCEE4\uBC0B\uB41C \uAE30\uBCF8 secret \uC73C\uB85C\uB3C4 \uAE30\uB3D9 \u2192 \uD1A0\uD070 \uC704\uC870 \uC2DC\uC5F0 \uAC00\uB2A5
#   false : (\uC548\uC804/\uC6B4\uC601) \uC57D\uD55C\u00B7\uAE30\uBCF8 secret \uC774\uBA74 \uAE30\uB3D9 \uC2E4\uD328(fail-closed). \uBC18\uB4DC\uC2DC JWT_SECRET \uC8FC\uC785
# \uC6B4\uC601\uC5D0\uC11C\uB294 \uC808\uB300 true \uB85C \uB450\uC9C0 \uB9D0 \uAC83.
jwt.allow-insecure-secret=${JWT_ALLOW_INSECURE_SECRET:true}

# [\uB85C\uADF8\uC778 \uC2DC\uB3C4 \uC81C\uD55C - bruteforce-demo] (OWASP #7) \uC5F0\uC18D \uB85C\uADF8\uC778 \uC2E4\uD328 \uC784\uACC4\uCE58 \uCD08\uACFC \uC2DC \uACC4\uC815\uC744 \uC77C\uC815 \uC2DC\uAC04 \uC7A0\uADFC\uB2E4.
# Burp Suite Intruder \uB85C \uBC18\uBCF5 \uC694\uCCAD \uC2DC N\uD68C \uC2E4\uD328 \uD6C4 401(LockedException)\uB85C \uAC70\uBD80\uB418\uB294\uC9C0 \uD655\uC778\uD558\uB294 \uC6A9\uB3C4.
login.lockout.max-attempts=5
# \uC7A0\uAE08 \uC2DC\uAC04 ( \uCD08 ) - 300\uCD08 = 5\uBD84
login.lockout.duration-seconds=300

# [\uC5ED\uC9C1\uB82C\uD654 \uB370\uBAA8 - 4-3 \uC11C\uBA85] \uCFE0\uD3F0 \uD1A0\uD070 HMAC-SHA256 \uC11C\uBA85 \uD0A4.
# \uC2E4\uC2B5\uC6A9 \uAE30\uBCF8\uAC12\uC774\uBA70, \uC6B4\uC601\uC5D0\uC11C\uB294 JWT_SECRET \uACFC \uB9C8\uCC2C\uAC00\uC9C0\uB85C \uD658\uACBD\uBCC0\uC218 VOUCHER_HMAC_SECRET \uC73C\uB85C \uC8FC\uC785\uD55C\uB2E4.
voucher.hmac-secret=${VOUCHER_HMAC_SECRET:f3a9c1e7b5d2486fa0c9e8d7b6a5948372615039}

# [\uBCF4\uC548 \uC124\uC815 \uC624\uB958 \uB370\uBAA8 - 2\uB2E8\uACC4(\uC870\uCE58)] (OWASP #2) Actuator \uB178\uCD9C \uBC94\uC704\uB97C \uAF2D \uD544\uC694\uD55C \uAC83\uB9CC\uC73C\uB85C \uCD95\uC18C\uD55C\uB2E4.
# 1\uB2E8\uACC4\uC5D0\uC11C\uB294 *(\uC804\uCCB4)\uB85C \uC5F4\uC5C8\uC9C0\uB9CC, \uC6B4\uC601 \uC810\uAC80\uC5D0 \uD544\uC694\uD55C \uAC74 \uB300\uAC1C health/info \uBFD0\uC774\uB2E4.
# \uD658\uACBD\uBCC0\uC218 ACTUATOR_EXPOSURE \uB85C \uD544\uC694\uD55C \uACBD\uC6B0\uC5D0\uB9CC \uBC94\uC704\uB97C \uB113\uD788\uB418, \uAE30\uBCF8\uAC12\uC740 \uCD5C\uC18C\uB85C \uB454\uB2E4.
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info}

# [\uBCF4\uC548 \uC124\uC815 \uC624\uB958 \uB370\uBAA8 - 2\uB2E8\uACC4(\uC870\uCE58)] show-values \uB294 Spring Boot \uAE30\uBCF8\uAC12(NEVER)\uC744 \uADF8\uB300\uB85C \uC4F4\uB2E4.
# (1\uB2E8\uACC4\uC5D0\uC11C always \uB85C \uBC14\uAFD4 \uD3C9\uBB38 \uB178\uCD9C\uC744 \uC7AC\uD604\uD588\uB358 \uC124\uC815\uC744 \uC81C\uAC70\uD568 \u2014 \uB354 \uC774\uC0C1 \uD544\uC694 \uC5C6\uB2E4)

# [\uBCF4\uC548 \uC124\uC815 \uC624\uB958 \uB370\uBAA8] \uB370\uBAA8\uC6A9 \uAC12. \uB178\uCD9C \uBC94\uC704 \uCD95\uC18C + SecurityConfig \uC778\uC99D \uAC00\uB4DC(\uC544\uB798)\uAC00
# \uBAA8\uB450 \uAC78\uB824 \uC788\uC73C\uBA74 \uB354 \uC774\uC0C1 \uC678\uBD80\uC5D0\uC11C \uC870\uD68C\uD560 \uC218 \uC5C6\uB2E4.
partner.billing.code=PTNR-8841-REALCODE

myboot.name=Prod Env

logging.level.com.basic.myspringboot=info

# mariadb db info
spring.datasource.url=jdbc:mariadb://127.0.0.1:3307/boot_db
spring.datasource.username=boot
spring.datasource.password=boot
spring.datasource.driverClassName=org.mariadb.jdbc.Driver

# hibernate info
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# [시간대 하드닝] Instant(UTC) 값을 DB TIMESTAMP 컬럼에 저장/조회할 때 KST(Asia/Seoul) 기준으로 변환한다.
#   미지정 시 JVM 기본 시간대로 변환되는데, 서버 환경에 따라 UTC 가 기본값일 수 있어
#   DB 에서 직접 조회한 expires_at 등이 로컬 시각보다 9시간 이르게 보일 수 있다.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# \uD55C \uBC88\uC5D0 \uAC00\uC838\uC62C \uC5F0\uAD00\uB41C \uAC1D\uCCB4(\uC790\uC2DD \uAC1D\uCCB4)\uC758 \uC218
spring.jpa.properties.hibernate.default_batch_fetch_size=100